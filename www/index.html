<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDROK AI</title>
<style>
:root{--bg:#000;--s:#0b0b10;--s2:#15151d;--tx:#ececf4;--mu:#7b7b92;--ln:#1e1e2a;--a:#6c5ce7;--a2:#22d3ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f7f7fb;--s:#fff;--s2:#eeeef6;--tx:#14142a;--mu:#666682;--ln:#dcdcea;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(55% 28% at 50% -8%,#6c5ce72a,transparent),var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}
header b{font-size:13px;letter-spacing:5px;font-weight:600;display:flex;align-items:center;gap:8px}
header b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-size:18px;cursor:pointer}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0;flex-direction:column;max-width:780px;margin:0 auto;padding:0 14px}
.view.on{display:flex}.scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
.scrim{position:fixed;inset:0;background:#000c;opacity:0;pointer-events:none;transition:.25s;z-index:20}.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;left:0;width:84%;max-width:320px;background:var(--s);border-right:1px solid var(--ln);z-index:21;transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
aside.on{transform:none}
.brand{display:flex;gap:10px;align-items:center;margin:0 4px 16px}.brand b{display:block;letter-spacing:4px;font-size:14px}.brand small{color:var(--mu);font-size:11px}
.lg,.av{flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6 0,transparent 28%),radial-gradient(circle at 50% 62%,#6c5ce7,#120a3a 72%)}
.lg{width:36px;height:36px;box-shadow:0 0 18px #6c5ce766}.av{width:24px;height:24px;margin-top:3px}
.ni,.ci{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--tx);border:0;background:transparent;font:inherit;width:100%;text-align:left}
.ni.on,.ci.on{background:var(--s2);box-shadow:inset 2px 0 0 var(--a2)}
.sec{color:var(--mu);font-size:10px;letter-spacing:3px;text-transform:uppercase;margin:18px 6px 6px}
.ci{padding:8px 10px;font-size:14px}.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci a{color:var(--mu);padding:2px 5px}
.orb{width:104px;aspect-ratio:1;border-radius:50%;position:relative;margin:34px auto 20px;background:radial-gradient(circle at 35% 30%,#ffffff55 0,transparent 26%),radial-gradient(circle at 70% 78%,#22d3ee88,transparent 50%),radial-gradient(circle at 50% 60%,#6c5ce7,#0f0830 72%);box-shadow:0 0 50px #6c5ce766,0 0 110px #22d3ee1f,inset 0 0 24px #ffffff22;animation:br 5s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid #ffffff14;border-top-color:var(--a2);animation:sp 6s linear infinite}
@keyframes br{50%{transform:scale(1.04)}}@keyframes sp{to{transform:rotate(360deg)}}
h2{text-align:center;margin:0;font-size:24px;font-weight:600;letter-spacing:.5px}
.sub{text-align:center;color:var(--mu);margin:4px 0 24px}
.sg{display:grid;grid-template-columns:1fr;gap:8px}
.sg button{display:flex;align-items:center;gap:14px;background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:13px 14px;text-align:left;color:var(--tx);font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.sg button:hover{border-color:var(--a)}.sg b{display:inline;font-size:20px}
.m{display:flex;gap:10px;margin:16px 0}.m.user{justify-content:flex-end}
.m .bd{min-width:0;overflow-wrap:anywhere;animation:in .25s ease}
.m.user .bd{background:var(--s2);border:1px solid var(--ln);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:86%}
.m.assistant .bd{flex:1}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.bd h4{margin:10px 0 2px;font-size:15px}.li{padding-left:4px}
.bd code{background:var(--s2);padding:1px 6px;border-radius:6px;font-size:13px;color:var(--a2)}
.cb{margin:8px 0;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#040408}
.ch{display:flex;justify-content:space-between;padding:6px 12px;background:#ffffff0c;color:#8e93b8;font-size:12px}.ch a{cursor:pointer;color:var(--a2)}
.cb pre{margin:0;padding:10px 12px;overflow-x:auto;color:#cdeedd;font:12px/1.5 ui-monospace,Menlo,monospace}
.ac{display:flex;gap:14px;margin-top:6px}.ac a{color:var(--mu);font-size:12px;cursor:pointer}.ac a:hover{color:var(--a2)}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--a2);animation:db 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes db{50%{transform:translateY(-5px);opacity:.4}}
.comp{display:flex;align-items:flex-end;gap:6px;background:var(--s);border:1px solid var(--ln);border-radius:24px;padding:6px;margin:6px 0 10px}
.comp:focus-within{border-color:var(--a)}
.comp textarea{flex:1;border:0;background:transparent;resize:none;max-height:140px;padding:9px 6px;color:var(--tx);font:inherit;outline:0}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--mu);font-size:18px;cursor:pointer;flex:none}
.rb.send{background:var(--a);color:#fff}.rb.rec{background:#ef4444;color:#fff;animation:br 1s infinite}
#chipimg{display:flex;align-items:center;gap:8px;margin-bottom:4px}#chipimg img{height:48px;border-radius:10px}
.btn{border:0;border-radius:12px;padding:10px 15px;background:var(--a);color:#fff;font:inherit;cursor:pointer;flex:none}
.btn.s{background:transparent;border:1px solid var(--ln);color:var(--tx)}
textarea.f,input,select{width:100%;background:var(--s);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit}
input:focus,select:focus,textarea.f:focus{outline:0;border-color:var(--a)}
.row{display:flex;gap:8px;margin:8px 0;align-items:flex-end}
.seg{display:flex;background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);padding:8px;border-radius:10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--s2);color:var(--tx)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0;scrollbar-width:none}.chips button{flex:none;border:1px solid var(--ln);background:var(--s);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
iframe{width:100%;height:60vh;min-height:300px;border:1px solid var(--ln);border-radius:14px;background:#fff}
.code{font:12px/1.5 ui-monospace,Menlo,monospace;min-height:50vh;resize:vertical}
.mu{color:var(--mu);font-size:13px}.pj{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:13px}
#tt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ln);padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-size:13px}#tt.on{opacity:1}
</style></head><body>
<header><button class="ib" id="mb" aria-label="Menyu">☰</button><b id="ht">IDROK AI</b><button class="ib" id="cn" aria-label="Yangi chat">✎</button></header>
<div class="scrim" id="sm"></div>
<aside id="dr"><div class="brand"><i class="lg"></i><div><b>IDROK AI</b><small>Think. Create. Build.</small></div></div><div id="dn"></div><div class="sec" id="sc2">Suhbatlar</div><div class="scroll" id="cl"></div></aside>
<main>
<section class="view on" id="v-chat">
 <div class="scroll" id="sc">
  <div id="empty"><div class="orb"></div><h2 id="gr">Salom!</h2><p class="sub">Bugun nima yaratamiz?</p>
   <div class="sg"><button data-q="Python haqida qisqacha tushuntirib ber"><b>🐍</b>Python o‘rgat</button><button data-q="Salom, qalaysiz? — shuni ingliz va rus tiliga tarjima qil"><b>🌐</b>Tarjima qil</button><button data-q="Menga 5 ta startap g‘oyasi ber"><b>💡</b>G‘oyalar</button><button data-q="12 * 17 + 305 ni hisoblab, yechimni tushuntir"><b>🧮</b>Matematika</button></div></div>
  <div id="msgs"></div>
 </div>
 <div id="chipimg" hidden><img id="vp"><button class="btn s" id="vx">✕</button></div>
 <div class="comp"><button class="rb" id="ca" aria-label="Rasm">📎</button><textarea id="ci" rows="1" placeholder="IDROK AI ga yozing…"></textarea><button class="rb" id="cm" aria-label="Mikrofon">🎤</button><button class="rb send" id="cb" aria-label="Yuborish">➤</button></div>
 <input type="file" id="vf" accept="image/*" hidden>
</section>
<section class="view" id="v-build"><div class="scroll">
 <select id="bk"><option value="website">Veb-sayt</option><option value="game">O‘yin</option><option value="mobile web app (PWA)">Ilova (PWA)</option><option value="Telegram bot">Telegram bot</option></select>
 <div class="chips"><button data-p="Neon dizaynli kalkulyator">Kalkulyator</button><button data-p="Vazifalar ro‘yxati (todo) ilovasi">Todo</button><button data-p="Ilon o‘yini">Ilon o‘yini</button><button data-p="Zamonaviy portfolio sayt">Portfolio</button></div>
 <div class="row"><textarea class="f" id="bp" rows="2" placeholder="Nima yaratamiz?"></textarea><button class="btn" id="bg">Yaratish</button></div>
 <div class="mu" id="bx"></div>
 <div class="seg"><button class="on" id="t-v">Ko‘rinish</button><button id="t-c">Kod</button></div>
 <div id="bv"><iframe id="bf" sandbox="allow-scripts" hidden></iframe></div>
 <div id="bc" hidden><textarea class="f code" id="ce" spellcheck="false"></textarea>
  <div class="row" style="flex-wrap:wrap"><button class="btn" id="cu">▶ Run</button><button class="btn s" id="cx">Xato top</button><button class="btn s" id="ci2">Yaxshila</button></div><div class="mu" id="cn2"></div></div>
 <div class="row"><button class="btn s" id="bs">💾 Saqlash</button><button class="btn s" id="bd">⬇ Yuklash</button></div>
</div></section>
<section class="view" id="v-proj"><div class="scroll" id="pl"></div></section>
<section class="view" id="v-set"><div class="scroll">
 <label>Til</label><select id="sl"><option value="uz">O‘zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select>
 <label>Mavzu</label><select id="st"><option value="dark">Qorong‘i</option><option value="light">Yorug‘</option></select>
 <label>Ismingiz</label><input id="sn" placeholder="AI sizni shunday chaqiradi">
 <label>Server manzili</label><input id="sa" placeholder="https://sizning-server.onrender.com">
 <div class="row"><button class="btn s" id="sk">Barcha suhbatlarni o‘chirish</button></div>
</div></section>
</main>
<div id="tt"></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),F='`'.repeat(3);
const LS={g(k,d){try{const v=localStorage.getItem('idrok.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem('idrok.'+k,JSON.stringify(v))}catch(e){}}};
const TR={uz:{chat:'Chat',build:'Yaratish',proj:'Loyihalar',set:'Sozlama',ch:'Suhbatlar'},ru:{chat:'Чат',build:'Создать',proj:'Проекты',set:'Настройки',ch:'Беседы'},en:{chat:'Chat',build:'Build',proj:'Projects',set:'Settings',ch:'Chats'}};
const IC={chat:'💬',build:'🛠',proj:'📁',set:'⚙'},LN={uz:'Uzbek',ru:'Russian',en:'English'},VL={uz:'uz-UZ',ru:'ru-RU',en:'en-US'},GR={uz:'Salom',ru:'Привет',en:'Hello'};
let lang=LS.g('lang','uz'),chats=LS.g('chats',[]),cur=chats[0]||null,S=null,D=null,vfile=null,work=LS.g('work',{code:'',type:'website'}),on='chat',lis=false;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const txt=p=>esc(p).split('\n').map(l=>{let m;if(m=l.match(/^#{1,3}\s+(.*)/))return '<h4>'+inl(m[1])+'</h4>';if(m=l.match(/^\s*[-*]\s+(.*)/))return '<div class="li">• '+inl(m[1])+'</div>';return inl(l)+'<br>'}).join('');
const fmt=t=>t.split(F).map((p,i)=>{if(i%2){const m=p.match(/^([\w+-]*)\n/);return '<div class="cb"><div class="ch"><span>'+esc(m?m[1]||'kod':'kod')+'</span><a data-cc>Nusxa</a></div><pre>'+esc(p.replace(/^[\w+-]*\n/,''))+'</pre></div>'}return txt(p)}).join('');
const code=t=>{const m=t.match(/```[\w+-]*\n([\s\S]*?)```/);return m?m[1].trim():null};
const toast=t=>{const e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)};
const SYS=()=>'You are IDROK AI (Think. Create. Build.), a universal professional assistant: answers, translation, math, explanations, coding, writing, building websites, games, apps and Telegram bots. Be clear and well structured. Reply in the language the user writes in (Uzbek, Russian or English); default '+LN[lang]+'.'+(LS.g('name','')?' User name: '+LS.g('name','')+'.':'');
const API=()=>(LS.g('api','')||window.IDROK_API||'').replace(/\/$/,'');
const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({mime:f.type||'image/jpeg',data:String(r.result).split(',')[1]});r.onerror=rej;r.readAsDataURL(f)});
async function ask(input,o){const u=API();if(!u)throw new Error('Server manzili kiritilmagan. Sozlamadan kiriting.');
 const r=await fetch(u+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:input,image:(o&&o.image)||null})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Server xatosi '+r.status));return j.text}
async function prepImg(o,f){o.image=await toB64(f)}
/* DRAWER + NAV */
const drawer=o=>{$('#dr').classList.toggle('on',o);$('#sm').classList.toggle('on',o)};
$('#mb').onclick=()=>drawer(true);$('#sm').onclick=()=>drawer(false);
function nav(id){on=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id));document.querySelectorAll('.ni').forEach(b=>b.classList.toggle('on',b.dataset.v===id));$('#ht').textContent=id==='chat'?'IDROK AI':TR[lang][id];drawer(false);
 if(id==='proj')drawP();if(id==='build'){$('#ce').value=work.code||'';if(isHtml(work.code))prev(work.code)}if(id==='chat')draw()}
function buildNav(){$('#dn').innerHTML=Object.keys(IC).map(k=>'<button class="ni" data-v="'+k+'"><span>'+IC[k]+'</span>'+TR[lang][k]+'</button>').join('');$('#sc2').textContent=TR[lang].ch;document.querySelectorAll('.ni').forEach(b=>b.onclick=()=>nav(b.dataset.v));nav(on)}
/* CHAT */
const saveC=()=>LS.s('chats',chats.slice(0,40));
function newChat(){if(cur&&!cur.m.length){nav('chat');return}cur={id:Date.now(),t:'Yangi chat',m:[]};chats.unshift(cur);saveC();nav('chat')}
$('#cn').onclick=newChat;
function list(){$('#cl').innerHTML=chats.map(c=>'<div class="ci'+(c===cur?' on':'')+'" data-id="'+c.id+'"><span>'+esc(c.t)+'</span><a data-r>✎</a><a data-d>🗑</a></div>').join('')||'<p class="mu" style="padding:6px">Hali suhbat yo‘q</p>'}
$('#cl').onclick=e=>{const el=e.target.closest('.ci');if(!el)return;const c=chats.find(x=>x.id==el.dataset.id);
 if(e.target.dataset.r!=null){const n=prompt('Chat nomi',c.t);if(n){c.t=n;saveC();list()}}
 else if(e.target.dataset.d!=null){if(confirm('Chat o‘chirilsinmi?')){chats=chats.filter(x=>x!==c);if(cur===c)cur=chats[0]||null;saveC();list();draw()}}
 else{cur=c;nav('chat')}};
function draw(){list();$('#gr').textContent=GR[lang]+(LS.g('name','')?', '+LS.g('name',''):'')+'!';const ms=cur?cur.m:[];$('#empty').hidden=!!ms.length;
 $('#msgs').innerHTML=ms.map((m,i)=>m.role==='user'?'<div class="m user"><div class="bd">'+esc(m.content)+'</div></div>':'<div class="m assistant"><i class="av"></i><div class="bd">'+(m.content==='…'?'<span class="dots"><span></span><span></span><span></span></span>':fmt(m.content)+'<div class="ac"><a data-c="'+i+'">Nusxa</a><a data-v="'+i+'">🔊</a>'+(i===ms.length-1?'<a data-rg>↻ Qayta</a>':'')+'<a data-sh="'+i+'">Ulashish</a></div>')+'</div></div>').join('');const sc=$('#sc');sc.scrollTop=sc.scrollHeight}
$('#msgs').onclick=async e=>{const d=e.target.dataset;
 if(d.cc!=null){try{await navigator.clipboard.writeText(e.target.closest('.cb').querySelector('pre').textContent);toast('Kod nusxalandi ✓')}catch(x){}return}
 if(d.rg!=null){cur.m.pop();run();return}
 const i=d.c??d.v??d.sh;if(i==null)return;const t=cur.m[i].content;
 if(d.c!=null){try{await navigator.clipboard.writeText(t);toast('Nusxalandi ✓')}catch(x){}}
 else if(d.v!=null){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[`*#]/g,''));u.lang=VL[lang];speechSynthesis.speak(u)}catch(x){}}
 else{try{await navigator.share({text:t})}catch(x){}}};
async function run(img){const a={role:'assistant',content:'…'};cur.m.push(a);draw();
 let h=cur.m.slice(0,-1).slice(-20);while(h[0]&&h[0].role!=='user')h.shift();
 const msgs=h.map((m,i)=>i?m:{role:m.role,content:SYS()+'\n\n'+m.content});
 try{const o={onText:({text})=>{a.content=text;draw()}};if(img)await prepImg(o,img);a.content=await ask(msgs,o)}catch(e){a.content='⚠ '+(e.message||e.code||'Xatolik')}saveC();draw()}
function grow(){const t=$('#ci');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'}
function clearImg(){vfile=null;$('#chipimg').hidden=true;$('#vf').value=''}
function send(q){const text=(q??$('#ci').value).trim();if(!text&&!vfile)return;$('#ci').value='';grow();if(!cur)newChat();const img=vfile;clearImg();
 cur.m.push({role:'user',content:(img?'🖼 ':'')+(text||'Rasmni tahlil qil')});if(cur.m.length===1)cur.t=(text||'Rasm').slice(0,30);run(img)}
$('#cb').onclick=()=>send();$('#ci').oninput=grow;$('#ci').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(hover:hover)').matches){e.preventDefault();send()}};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
$('#ca').onclick=()=>$('#vf').click();$('#vx').onclick=clearImg;
$('#vf').onchange=e=>{vfile=e.target.files[0];if(vfile){$('#vp').src=URL.createObjectURL(vfile);$('#chipimg').hidden=false}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#cm').onclick=()=>{if(!SR){toast('Ovozdan matn yo‘q — klaviaturadagi 🎤 dan foydalaning');return}
 if(lis){rec&&rec.stop();return}rec=new SR();rec.lang=VL[lang];rec.onresult=e=>{$('#ci').value=($('#ci').value+' '+e.results[0][0].transcript).trim();grow()};
 rec.onend=rec.onerror=()=>{lis=false;$('#cm').classList.remove('rec')};try{rec.start();lis=true;$('#cm').classList.add('rec')}catch(e){}};
/* BUILD */
const isHtml=c=>/<html|<!doctype/i.test(c||'');
const ext=c=>isHtml(c)?'html':/^\s*(import|from|def|async)\b/m.test(c||'')?'py':'txt';
const saveW=()=>LS.s('work',work);
function prev(c){const f=$('#bf');f.hidden=false;f.srcdoc=c}
function tab(c){$('#bv').hidden=c;$('#bc').hidden=!c;$('#t-v').classList.toggle('on',!c);$('#t-c').classList.toggle('on',c)}
$('#t-v').onclick=()=>tab(false);$('#t-c').onclick=()=>tab(true);
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#bp').value=b.dataset.p});
$('#bg').onclick=async()=>{const p=$('#bp').value.trim();if(!p)return;const k=$('#bk').value;$('#bx').textContent='Yaratilmoqda…';
 try{const r=await ask([{role:'user',content:SYS()+'\nTask: create a '+k+'. For website/game/web app produce ONE self-contained mobile-friendly HTML file (inline CSS+JS, polished modern design) in a single '+F+'html block. For a Telegram bot produce Python (aiogram 3) in a '+F+'python block with setup steps. Keep the explanation under 50 words, in the user\'s language.\nRequest: '+p}]);
 const c=code(r);work={code:c||r,type:k,name:p.slice(0,28)};saveW();$('#ce').value=work.code;$('#bx').innerHTML=fmt(r.replace(/```[\s\S]*?```/g,'').trim());if(isHtml(c)){prev(c);tab(false)}else{$('#bf').hidden=true;tab(true)}}catch(e){$('#bx').textContent='⚠ '+(e.message||e.code)}};
$('#ce').oninput=e=>{work.code=e.target.value;saveW()};
$('#cu').onclick=()=>{prev($('#ce').value);tab(false)};
async function aiCode(fix){const c=$('#ce').value;if(!c.trim())return;$('#cn2').textContent='…';
 try{const r=await ask([{role:'user',content:SYS()+'\n'+(fix?'Find bugs in this code and fix them.':'Improve this code (quality, design, performance).')+' Return the full updated code in one '+F+' block, then a short list of changes.\n\n'+F+'\n'+c+'\n'+F}]);
 const n=code(r);if(n){$('#ce').value=n;work.code=n;saveW();if(isHtml(n))prev(n)}$('#cn2').innerHTML=fmt(r.replace(/```[\s\S]*?```/g,'').trim())}catch(e){$('#cn2').textContent='⚠ '+(e.message||e.code)}}
$('#cx').onclick=()=>aiCode(true);$('#ci2').onclick=()=>aiCode(false);
$('#bs').onclick=()=>{if(!work.code){toast('Avval kod yarating');return}const n=prompt('Loyiha nomi',work.name||'Loyiha');if(!n)return;const l=LS.g('proj',[]);l.unshift({id:Date.now(),n,type:work.type,code:work.code,d:new Date().toLocaleDateString()});LS.s('proj',l);toast('Saqlandi ✓')};
async function dl(name,data){try{await navigator.clipboard.writeText(data)}catch(e){}try{const f=new File([data],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}toast('Kod nusxalandi ✓')}
$('#bd').onclick=()=>work.code?dl('idrok-project.'+ext(work.code),work.code):toast('Avval kod yarating');
/* PROJECTS */
function drawP(){const l=LS.g('proj',[]);$('#pl').innerHTML=l.length?l.map(p=>'<div class="pj"><b>'+esc(p.n)+'</b> <span class="mu">'+esc(p.type)+' · '+p.d+'</span><div class="row"><button class="btn s" data-o="'+p.id+'">Ochish</button><button class="btn s" data-dl="'+p.id+'">⬇</button><button class="btn s" data-x="'+p.id+'">🗑</button></div></div>').join(''):'<p class="mu" style="text-align:center;margin-top:48px">Hali loyiha yo‘q.<br>«Yaratish» bo‘limida yarating va saqlang.</p>'}
$('#pl').onclick=e=>{const l=LS.g('proj',[]),d=e.target.dataset,id=d.o||d.dl||d.x;if(!id)return;const p=l.find(x=>x.id==id);
 if(d.o){work={code:p.code,type:p.type,name:p.n};saveW();nav('build')}else if(d.dl)dl(p.n.replace(/\W+/g,'_')+'.'+ext(p.code),p.code);else if(confirm('O‘chirilsinmi?')){LS.s('proj',l.filter(x=>x.id!=id));drawP()}};
/* SETTINGS */
const applyTheme=t=>document.documentElement.dataset.theme=t;
$('#sl').value=lang;$('#st').value=LS.g('theme','dark');$('#sn').value=LS.g('name','');applyTheme($('#st').value);
$('#sl').onchange=e=>{lang=e.target.value;LS.s('lang',lang);buildNav();draw()};
$('#st').onchange=e=>{LS.s('theme',e.target.value);applyTheme(e.target.value)};
$('#sn').oninput=e=>LS.s('name',e.target.value);
$('#sk').onclick=()=>{if(confirm('Barcha suhbatlar o‘chirilsinmi?')){chats=[];cur=null;saveC();draw()}};
$('#sa').value=LS.g('api','');$('#sa').oninput=e=>LS.s('api',e.target.value.trim());
buildNav();nav('chat');

</script></body></html>
